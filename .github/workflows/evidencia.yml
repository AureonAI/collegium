# Âncora externa (FORGE 3.1): roda em máquinas do GitHub, fora do controle do autor.
# Se os hashes de resultados/HASHES.txt baterem em Windows, macOS e Linux, a evidência
# deixa de depender de quem a produziu.
name: evidencia
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduzir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python ferramentas/testes_ci.py
      - name: Instalação como estranho (pip install + ciclo do produto fora da pasta do projeto)
        run: python ferramentas/instalacao_limpa.py
      - name: Reproduzir e conferir hashes
        run: python reproduzir.py --conferir
      - name: Testemunha do pré-registro (anotação com carimbo de tempo do GitHub)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python ferramentas/testemunha.py
