# Âncora externa (FORGE 3.1): roda em máquinas do GitHub, fora do controle do autor.
# Se os hashes de resultados/HASHES.txt baterem em Windows, macOS e Linux, a evidência
# deixa de depender de quem a produziu.
name: evidencia
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduzir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Reproduzir e conferir hashes
        run: python reproduzir.py --conferir
